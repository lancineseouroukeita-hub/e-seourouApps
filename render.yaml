services:
  - type: web
    name: seourouapps
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      # Identifiants du serveur TURN (relais des appels audio/vidéo entre deux
      # réseaux différents) : renseigner ici pour les faire tourner sans
      # nouveau déploiement, plutôt que de les modifier dans le code comme
      # avant. Laissés vides, l'application garde le compte Metered.ca gratuit
      # utilisé jusqu'ici — voir backend/src/controllers/call.controller.js.
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_HOST
        sync: false
      # Identifiants pour l'envoi réel des codes par SMS (vérification du
      # numéro, mot de passe oublié) : renseigner ici sans nouveau déploiement.
      # Laissés vides, l'appli continue de fonctionner mais se contente de
      # journaliser le code au lieu de l'envoyer — voir backend/src/utils/sms.js.
      # Orange (moins cher pour la Guinée, payable par crédit Orange/Orange
      # Money) est utilisé en priorité si renseigné, Twilio sinon.
      - key: ORANGE_CLIENT_ID
        sync: false
      - key: ORANGE_CLIENT_SECRET
        sync: false
      - key: ORANGE_SENDER_ADDRESS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
