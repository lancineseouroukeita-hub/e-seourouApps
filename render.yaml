services:
  - type: web
    name: seourouapps
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      # Identifiants du serveur TURN (relais des appels audio/vidéo entre deux
      # réseaux différents) : renseigner ici pour les faire tourner sans
      # nouveau déploiement, plutôt que de les modifier dans le code comme
      # avant. Laissés vides, l'application garde le compte Metered.ca gratuit
      # utilisé jusqu'ici — voir backend/src/controllers/call.controller.js.
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_HOST
        sync: false
